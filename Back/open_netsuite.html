<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSuite Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        input {
            padding: 5px;
            margin-right: 10px;
        }
        button {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="netsuiteForm">
            <input type="text" id="idInput" placeholder="Enter Netsuite ID" required>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        document.getElementById('netsuiteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('idInput').value;
            const url = `https://${id}-sb1.app.netsuite.com/app/login/secure/enterpriselogin.nl?c=${id}_SB1&redirect=%2Fapp%2Fcenter%2Fcard.nl%3Fsc%3D-29%26whence%3D&whence=`;
            window.open(url, '_blank');
        });
    </script>
</body>
</html>
