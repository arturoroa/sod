workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
  auto_cancel:
    on_new_commit: interruptible

stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - NewSOD

  before_script:
    - 'python3.11 -m pip install --upgrade pip'
    - 'pkill -f "python3.11 API.py" || true'
    - 'python3.11 -m pip install virtualenv'
    - 'python3.11 -m venv SODVenv'
    - 'python3.11 -m pip install -r requirements.txt'

  script:
    - 'echo "Branch detectada: $CI_COMMIT_BRANCH"'
    - 'echo "Commit detectado: $CI_COMMIT_SHA"'
    - 'git fetch origin'
    - 'git checkout $CI_COMMIT_BRANCH || git checkout -B $CI_COMMIT_BRANCH origin/$CI_COMMIT_BRANCH'
    - 'git reset --hard $CI_COMMIT_SHA'
    - 'git rev-parse --abbrev-ref HEAD'
    - 'git log -1 --oneline'
    - 'source SODVenv/bin/activate'
    - 'python3.11 -m pip install -r requirements.txt'
    - 'cd Back'
    - python3.11 API.py  &
    - 'echo "Deployment stage completed for branch $CI_COMMIT_BRANCH"'

  timeout: 7 days
